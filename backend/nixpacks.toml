[phases.setup]
# Explicitly provision both Python 3.11 and OpenJDK 17 binaries into the Nix profile
nixPkgs = ["python311", "openjdk17"]

[phases.install]
cmds = [
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt"
]

[start]
# Execute using the exact virtual environment path to guarantee isolation
cmd = "python3 app.py"